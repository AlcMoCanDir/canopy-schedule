<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALC Mosaic — Offerings</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#fafafa;margin:0;padding:20px}
.container{max-width:1300px;margin:auto;background:white;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h1{text-align:center;color:#4CAF50;margin:0 0 4px}
.subtitle{text-align:center;color:#888;font-size:14px;margin:0 0 20px}
.tabs{display:flex;gap:5px;border-bottom:2px solid #ddd;margin:20px 0;flex-wrap:wrap}
.tab{padding:11px 20px;background:#f0f0f0;border:none;cursor:pointer;font-size:14px;border-radius:8px 8px 0 0;font-weight:600;color:#555}
.tab:hover{background:#e0e0e0}
.tab.active{background:white;color:#4CAF50;border-bottom:3px solid #4CAF50}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── Filters ─────────────────────────────────────────────── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:12px 14px;background:#f8f9fa;border-radius:6px;margin-bottom:14px}
.filter-bar input[type=text]{flex:1;min-width:180px;padding:7px 10px;
  border:1px solid #ccc;border-radius:4px;font-size:13px}
.filter-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filter-group span{font-size:12px;font-weight:600;color:#666;white-space:nowrap}
.filter-btn{padding:5px 12px;border:1px solid #ccc;background:white;
  border-radius:4px;cursor:pointer;font-size:12px;color:#555;transition:all .15s}
.filter-btn:hover{background:#e8f5e9;border-color:#4CAF50}
.filter-btn.active{background:#4CAF50;color:white;border-color:#4CAF50}

/* ── Weekly grid ─────────────────────────────────────────── */
.schedule-table{width:100%;border-collapse:collapse;margin-top:4px}
.schedule-table th,.schedule-table td{border:1px solid #ddd;padding:6px;font-size:12px;vertical-align:top}
.schedule-table th{background:#4CAF50;color:white;font-weight:bold;text-align:center;position:sticky;top:0;z-index:10}
.time-col{font-weight:bold;background:#f8f9fa;text-align:center;white-space:nowrap;font-size:11px;color:#555}
.lunch-row td{background:#fff9e6;text-align:center;color:#aaa;font-style:italic;font-size:11px;padding:5px}

/* Offering cards — clickable */
.view-card{font-size:11px;padding:7px 8px;margin:4px 0;border-left:3px solid #2196F3;
  background:#f0f7ff;border-radius:4px;cursor:pointer;transition:all .15s}
.view-card:hover{background:#dbeafe;border-left-color:#1d4ed8;transform:translateX(2px)}
.view-card-name{font-weight:700;color:#1e3a5f;margin-bottom:2px}
.view-card-info{font-size:10px;color:#555}
.view-card-hint{font-size:9px;color:#94a3b8;margin-top:3px;font-style:italic}
.type-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:8px;
  font-weight:700;text-transform:uppercase;margin-left:3px}
.type-Commit{background:#ffcdd2;color:#c62828}
.type-Drop-in{background:#c8e6c9;color:#2e7d32}
.view-card.faded{opacity:.3;pointer-events:none}

/* ── Description popup (modal) ───────────────────────────── */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;
  align-items:center;justify-content:center;padding:20px}
.popup-overlay.open{display:flex}
.popup-box{background:white;border-radius:10px;width:100%;max-width:500px;
  max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.25);padding:0}
.popup-head{padding:16px 20px;background:#4CAF50;color:white;border-radius:10px 10px 0 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.popup-head h2{margin:0;font-size:16px;line-height:1.3}
.popup-close{background:none;border:none;color:white;font-size:22px;cursor:pointer;
  line-height:1;padding:0;flex-shrink:0}
.popup-body{padding:18px 20px}
.popup-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.popup-badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase}
.popup-badge-commit{background:#ffebee;color:#c62828}
.popup-badge-dropin{background:#e8f5e9;color:#2e7d32}
.popup-badge-group{background:#e3f2fd;color:#1565c0}
.popup-detail{font-size:13px;color:#555;margin:5px 0;display:flex;gap:8px;align-items:flex-start}
.popup-detail span{font-size:16px;flex-shrink:0}
.popup-desc{margin-top:14px;padding-top:14px;border-top:1px solid #eee;
  font-size:13px;color:#333;line-height:1.6}
.popup-nodesc{margin-top:14px;padding-top:14px;border-top:1px solid #eee;
  font-size:13px;color:#aaa;font-style:italic}

/* ── Learner Schedule tab ────────────────────────────────── */
.learner-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:#f8f9fa;padding:14px;border-radius:6px;margin-bottom:16px}
.learner-controls label{font-weight:600;font-size:14px;color:#333;white-space:nowrap}
.learner-controls select{flex:1;min-width:200px;padding:9px 12px;font-size:14px;
  border:2px solid #ddd;border-radius:6px}
.learner-controls button{padding:9px 18px;font-size:14px;font-weight:600;
  border:none;border-radius:6px;cursor:pointer;color:white;white-space:nowrap}
.btn-green{background:#4CAF50}.btn-green:hover{background:#43a047}
.btn-blue{background:#2196F3}.btn-blue:hover{background:#1976d2}
.ls-grid{width:100%;border-collapse:collapse;table-layout:fixed}
.ls-grid th,.ls-grid td{border:1px solid #ddd;padding:8px;font-size:12px;vertical-align:top}
.ls-grid th{background:#2196F3;color:white;font-weight:bold;text-align:center}
.ls-time{background:#f8f9fa;font-weight:700;text-align:center;font-size:11px;color:#555;white-space:nowrap}
.ls-lunch{background:#fff9e6;text-align:center;color:#aaa;font-style:italic;font-size:11px}
.ls-cell{min-height:70px}
.ls-card{padding:8px 10px;margin:4px 0;border-left:4px solid #2196F3;
  background:#e8f4fd;border-radius:4px;font-size:12px}
.ls-card-name{font-weight:700;color:#1565c0;font-size:13px;margin-bottom:4px}
.ls-card-detail{font-size:11px;color:#555;margin:2px 0;line-height:1.4}
.ls-card-badge{display:inline-block;padding:2px 6px;border-radius:3px;
  font-size:9px;font-weight:700;text-transform:uppercase;margin-left:5px;vertical-align:middle}
.ls-empty{color:#ccc;text-align:center;padding:16px 0;font-size:12px}

.loading{text-align:center;padding:60px;color:#999}
.spinner{border:4px solid #f3f3f3;border-top:4px solid #4CAF50;border-radius:50%;
  width:36px;height:36px;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{padding:10px 14px;border-radius:6px;font-size:13px;font-weight:600;margin-bottom:12px;display:none}
.msg-error{background:#f8d7da;color:#721c24}
.msg-success{background:#d4edda;color:#155724}
.msg-info{background:#cce5ff;color:#004085}

/* ── Print ───────────────────────────────────────────────── */
@media print{
  @page{size:8.5in 11in portrait;margin:.4in}
  body{background:white!important;margin:0!important;padding:0!important}
  .container,.popup-overlay{display:none!important}
  #printSheet{display:block!important}
}
#printSheet{display:none;font-family:Arial,sans-serif;font-size:9pt;color:#000}
#printSheet .ps-title{font-size:13pt;font-weight:bold;text-align:center;margin:0 0 2pt}
#printSheet .ps-meta{font-size:8pt;text-align:center;color:#444;margin:0 0 8pt}
#printSheet table{width:100%;border-collapse:collapse;table-layout:fixed}
#printSheet th,#printSheet td{border:1pt solid #000;padding:3pt 4pt;vertical-align:top;word-wrap:break-word}
#printSheet th{background:#000!important;color:#fff!important;font-weight:bold;font-size:8pt;
  text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet .ps-time{background:#f0f0f0!important;font-weight:bold;font-size:7.5pt;text-align:center;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet .ps-lunch{background:#f9f4e8!important;text-align:center;font-size:7.5pt;
  color:#888;font-style:italic;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet .ps-cell{font-size:8pt;min-height:18pt}
#printSheet .ps-name{font-weight:bold;font-size:8pt;display:block;margin-bottom:1pt}
#printSheet .ps-info{font-size:7pt;color:#333;display:block;line-height:1.3}
#printSheet .ps-empty{color:#ccc;text-align:center;font-size:8pt}

@media(max-width:768px){
  .schedule-table{font-size:10px}
  .filter-bar{flex-direction:column;align-items:stretch}
  .learner-controls{flex-direction:column;align-items:stretch}
  .learner-controls select,.learner-controls button{width:100%}
}
</style>
</head>
<body>
<div class="container">

<h1 id="pageTitle">ALC Mosaic</h1>
<p class="subtitle" id="sessionLabel">Loading…</p>

<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">📅 Session Schedule</div>
  <div class="tab" onclick="switchTab(1)">👤 Learner Schedules</div>
</div>

<!-- ══ TAB 0 — Weekly Schedule ══════════════════════════════ -->
<div class="tab-content active" id="tab-grid">

  <!-- Filters -->
  <div class="filter-bar">
    <input type="text" id="gridSearch" placeholder="🔍 Search offerings…" oninput="drawGrid()">
    <div class="filter-group">
      <span>Group:</span>
      <button class="filter-btn active" data-gf="all"      onclick="setGf('all')">All</button>
      <button class="filter-btn"        data-gf="EC"       onclick="setGf('EC')">EC</button>
      <button class="filter-btn"        data-gf="Saplings" onclick="setGf('Saplings')">Saplings</button>
      <button class="filter-btn"        data-gf="Canopy"   onclick="setGf('Canopy')">Canopy</button>
      <button class="filter-btn"        data-gf="Acorns"   onclick="setGf('Acorns')">Acorns</button>
    </div>
    <div class="filter-group">
      <span>Type:</span>
      <button class="filter-btn active" data-tf="all"     onclick="setTf('all')">All</button>
      <button class="filter-btn"        data-tf="Commit"  onclick="setTf('Commit')">Commitment</button>
      <button class="filter-btn"        data-tf="Drop-in" onclick="setTf('Drop-in')">Drop-in</button>
    </div>
  </div>

  <p style="font-size:12px;color:#888;margin:0 0 10px;text-align:center">
    Click any offering to see full details and description
  </p>

  <div id="gridContainer">
    <div class="loading"><div class="spinner"></div><p>Loading schedule…</p></div>
  </div>
</div>

<!-- ══ TAB 1 — Learner Schedules ════════════════════════════ -->
<div class="tab-content" id="tab-learner">
  <div class="learner-controls">
    <label for="learnerSelect">Select Learner:</label>
    <select id="learnerSelect">
      <option value="">— Choose a learner —</option>
    </select>
    <button class="btn-green" onclick="loadLearnerSchedule()">📥 View Schedule</button>
    <button class="btn-blue"  onclick="printLearnerSchedule()" id="printBtn" style="display:none">
      🖨️ Print
    </button>
  </div>
  <div class="msg" id="learnerMsg"></div>
  <div id="learnerScheduleContainer">
    <div style="text-align:center;padding:50px 20px;color:#bbb">
      <div style="font-size:48px;margin-bottom:12px">👤</div>
      <p style="font-size:16px;margin:0">Select a learner above to view their approved schedule</p>
    </div>
  </div>
</div>

</div><!-- /container -->

<!-- ══ Offering Description Popup ═══════════════════════════ -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup(event)">
  <div class="popup-box">
    <div class="popup-head">
      <h2 id="popupTitle">Offering Details</h2>
      <button class="popup-close" onclick="closePopupDirect()">×</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
  </div>
</div>

<!-- Print-only sheet -->
<div id="printSheet"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwUV7DXx8J4p31M5jT5NjulaSdmWMpxdDWDogUEv4bFB2Gc5NcDGKSco9ytsmdxhNzu/exec';

const TIMES = [
  { name:'Block 1', time:'10:00-10:45', display:'10:00–10:45 am' },
  { name:'Block 2', time:'10:50-11:35', display:'10:50–11:35 am' },
  { name:'🍽 Lunch', time:'11:35-12:05', display:'11:35–12:05 pm', lunch:true },
  { name:'Block 3', time:'12:10-12:55', display:'12:10–12:55 pm' },
  { name:'Block 4', time:'1:00-1:50',   display:'1:00–1:50 pm' },
  { name:'Block 5', time:'1:55-2:45',   display:'1:55–2:45 pm' }
];
const DAYS = ['monday','tuesday','wednesday','thursday','friday'];
const BLOCK_MAP = {
  'block 1':'10:00-10:45','block 2':'10:50-11:35','block 3':'12:10-12:55',
  'block 4':'1:00-1:50','block 5':'1:55-2:45','lunch':'11:35-12:05'
};

let offerings    = [];
let enrollCounts = {};
let studentNames = [];
let sessionConfig = {};
let gridFilters  = { group:'all', type:'all', search:'' };
let currentLearnerOfferings = [];
let currentLearnerName = '';

function normTime(t) {
  if (!t) return '';
  const s = String(t).trim();
  return BLOCK_MAP[s.toLowerCase()] || s;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showMsg(text, type) {
  const el = document.getElementById('learnerMsg');
  el.textContent = text;
  el.className = 'msg msg-' + type;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = 'none', 5000);
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  try {
    const [sessionRes, offRes, countsRes, studentsRes] = await Promise.all([
      fetch(`${API}?action=getSessionConfig`).then(r=>r.json()).catch(()=>({success:false})),
      fetch(`${API}?action=loadOfferings`).then(r=>r.json()).catch(()=>({offerings:[]})),
      fetch(`${API}?action=getEnrollmentCounts`).then(r=>r.json()).catch(()=>({counts:{}})),
      fetch(`${API}?action=getAllStudents`).then(r=>r.json()).catch(()=>({success:false,students:[]}))
    ]);

    sessionConfig = sessionRes.success ? sessionRes : { fullSessionName:'ALC Mosaic', siteTitle:'ALC Mosaic', siteSubtitle:'' };
    offerings     = offRes.offerings  || [];
    enrollCounts  = countsRes.counts  || {};
    studentNames  = (studentsRes.success && studentsRes.students) ? studentsRes.students : [];

    const siteTitle    = sessionConfig.siteTitle    || 'ALC Mosaic';
    const siteSubtitle = sessionConfig.siteSubtitle || sessionConfig.fullSessionName || '';

    document.getElementById('pageTitle').textContent    = siteTitle;
    document.getElementById('sessionLabel').textContent = siteSubtitle;
    document.title = siteTitle;

    populateLearnerDropdown();
    drawGrid();
  } catch(e) {
    document.getElementById('gridContainer').innerHTML =
      `<p style="text-align:center;color:#f44336;padding:40px">Error loading: ${esc(e.message)}</p>`;
  }
}

// ── Grid filters ──────────────────────────────────────────────
function setGf(v) {
  gridFilters.group = v;
  document.querySelectorAll('[data-gf]').forEach(b => b.classList.toggle('active', b.dataset.gf === v));
  drawGrid();
}
function setTf(v) {
  gridFilters.type = v;
  document.querySelectorAll('[data-tf]').forEach(b => b.classList.toggle('active', b.dataset.tf === v));
  drawGrid();
}

function offeringMatchesGridFilter(o) {
  if (gridFilters.group !== 'all' && o.level !== gridFilters.group) return false;
  if (gridFilters.type  !== 'all' && o.type  !== gridFilters.type)  return false;
  if (gridFilters.search) {
    const text = (o.name+' '+o.instructor+' '+o.location+' '+(o.description||'')).toLowerCase();
    if (!text.includes(gridFilters.search)) return false;
  }
  return true;
}

// ── TAB 0 — Weekly grid ───────────────────────────────────────
function drawGrid() {
  gridFilters.search = (document.getElementById('gridSearch').value || '').toLowerCase();
  const activeIds = new Set(offerings.filter(offeringMatchesGridFilter).map(o => o.id));
  const anyFilter = gridFilters.group !== 'all' || gridFilters.type !== 'all' || gridFilters.search;

  let html = `<table class="schedule-table">
    <thead><tr>
      <th style="width:100px">Time</th>
      <th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th>
    </tr></thead><tbody>`;

  TIMES.forEach(block => {
    if (block.lunch) {
      html += `<tr class="lunch-row">
        <td style="font-weight:700;background:#f8f9fa;font-size:11px;color:#555;text-align:center">
          ${block.name}<br><span style="font-size:10px;font-weight:normal">${block.display}</span>
        </td>
        <td colspan="5">Lunch Break</td>
      </tr>`;
      return;
    }

    html += `<tr><td class="time-col">${block.name}<br>${block.display}</td>`;

    DAYS.forEach(day => {
      const matching = offerings.filter(o => {
        const days  = (o.day  || '').split(',').map(d => d.trim().toLowerCase());
        const times = (o.time || '').split(',').map(t => normTime(t.trim()));
        return days.includes(day) && times.includes(block.time);
      });

      if (!matching.length) {
        html += `<td style="background:#fafafa"></td>`;
      } else {
        html += `<td>`;
        matching.forEach(o => {
          const enrolled  = enrollCounts[o.id] || 0;
          const capacity  = Number(o.capacity) || 999;
          const full      = enrolled >= capacity;
          const faded     = anyFilter && !activeIds.has(o.id);
          const fullLabel = full ? ' <span style="color:#f44336;font-size:9px;font-weight:700">FULL</span>' : '';

          html += `<div class="view-card${faded?' faded':''}" onclick="showPopup(${o.id})">
            <div class="view-card-name">
              ${esc(o.name)}
              <span class="type-badge type-${esc(o.type)}">${esc(o.type)}</span>
              ${fullLabel}
            </div>
            <div class="view-card-info">
              👤 ${esc(o.instructor)}
              ${o.location ? ' · 📍 ' + esc(o.location) : ''}
              · ${enrolled}/${capacity===999?'∞':capacity}
            </div>
            <div class="view-card-hint">Click for details</div>
          </div>`;
        });
        html += `</td>`;
      }
    });

    html += `</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById('gridContainer').innerHTML = html;
}

// ── Offering popup ────────────────────────────────────────────
function showPopup(offeringId) {
  const o        = offerings.find(x => x.id === offeringId);
  if (!o) return;

  const enrolled = enrollCounts[o.id] || 0;
  const capacity = Number(o.capacity) || 999;
  const full     = enrolled >= capacity;

  const days  = (o.day  || '').split(',').map(d => { const x=d.trim(); return x.charAt(0).toUpperCase()+x.slice(1); }).join(', ');
  const times = (o.time || '').split(',').map(t => {
    const b = TIMES.find(x => x.time === normTime(t.trim()));
    return b ? b.display : t.trim();
  }).join(', ');

  const typeBadgeCls = o.type === 'Commit' ? 'popup-badge-commit' : 'popup-badge-dropin';

  document.getElementById('popupTitle').textContent = o.name;
  document.getElementById('popupBody').innerHTML = `
    <div class="popup-meta">
      <span class="popup-badge ${typeBadgeCls}">${esc(o.type)}</span>
      ${o.level ? `<span class="popup-badge popup-badge-group">${esc(o.level)}</span>` : ''}
      ${full ? `<span class="popup-badge" style="background:#ffebee;color:#c62828">FULL</span>` : ''}
    </div>
    <div class="popup-detail"><span>👤</span><div><strong>Instructor:</strong> ${esc(o.instructor)}</div></div>
    ${o.location ? `<div class="popup-detail"><span>📍</span><div><strong>Location:</strong> ${esc(o.location)}</div></div>` : ''}
    <div class="popup-detail"><span>📅</span><div><strong>Days:</strong> ${esc(days || 'TBA')}</div></div>
    <div class="popup-detail"><span>🕐</span><div><strong>Time:</strong> ${esc(times || 'TBA')}</div></div>
    <div class="popup-detail"><span>🪑</span><div>
      <strong>Enrollment:</strong> ${enrolled} / ${capacity===999?'unlimited':capacity}
      ${full ? ' <span style="color:#f44336;font-weight:700">(Full)</span>' : `<span style="color:#4CAF50"> (${capacity===999?'open':capacity-enrolled+' spot'+(capacity-enrolled===1?'':'s')+' left'})</span>`}
    </div></div>
    ${o.description
      ? `<div class="popup-desc">${esc(o.description)}</div>`
      : `<div class="popup-nodesc">No description available for this offering.</div>`}`;

  document.getElementById('popupOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePopup(e) {
  // Only close if clicking the overlay backdrop itself, not the box
  if (e.target === document.getElementById('popupOverlay')) closePopupDirect();
}
function closePopupDirect() {
  document.getElementById('popupOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopupDirect(); });

// ── TAB 1 — Learner Schedules ─────────────────────────────────
function populateLearnerDropdown() {
  const sel = document.getElementById('learnerSelect');
  sel.innerHTML = '<option value="">— Choose a learner —</option>';
  [...studentNames]
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.grade ? `${s.name} — ${s.grade}` : s.name;
      sel.appendChild(opt);
    });
}

async function loadLearnerSchedule() {
  const name = document.getElementById('learnerSelect').value;
  if (!name) { showMsg('Please select a learner first', 'error'); return; }

  currentLearnerName = name;
  currentLearnerOfferings = [];
  document.getElementById('printBtn').style.display = 'none';
  document.getElementById('learnerScheduleContainer').innerHTML =
    '<div class="loading"><div class="spinner"></div><p>Loading…</p></div>';

  try {
    const d = await fetch(`${API}?action=loadStudent&studentName=${encodeURIComponent(name)}`).then(r=>r.json());
    if (!d.success) throw new Error(d.message || 'Failed to load');

    currentLearnerOfferings = d.offerings || [];

    if (!currentLearnerOfferings.length) {
      document.getElementById('learnerScheduleContainer').innerHTML =
        `<div style="text-align:center;padding:50px 20px;color:#bbb">
          <div style="font-size:40px;margin-bottom:10px">📭</div>
          <p style="font-size:15px;margin:0">No approved schedule found for <strong>${esc(name)}</strong></p>
          <p style="font-size:13px;color:#aaa;margin-top:8px">Ask your facilitator if your schedule has been approved</p>
        </div>`;
      showMsg(`No approved schedule found for ${name}`, 'info');
      return;
    }

    renderLearnerSchedule();
    document.getElementById('printBtn').style.display = 'inline-block';
    showMsg(`✅ Loaded ${currentLearnerOfferings.length} offering(s) for ${name}`, 'success');
  } catch(e) {
    document.getElementById('learnerScheduleContainer').innerHTML =
      `<p style="text-align:center;color:#f44336;padding:30px">Error: ${esc(e.message)}</p>`;
    showMsg('Error loading schedule: ' + e.message, 'error');
  }
}

function renderLearnerSchedule() {
  const offs = currentLearnerOfferings;
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;
      margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid #e3f2fd">
      <div>
        <div style="font-size:18px;font-weight:700;color:#1565c0">${esc(currentLearnerName)}'s Schedule</div>
        <div style="font-size:12px;color:#888;margin-top:2px">
          ${offs.length} approved offering(s) · ${esc(sessionConfig.fullSessionName || '')}
        </div>
      </div>
    </div>
    <table class="ls-grid">
      <thead><tr>
        <th style="width:100px">Time</th>
        <th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th>
      </tr></thead><tbody>`;

  TIMES.forEach(block => {
    if (block.lunch) {
      html += `<tr>
        <td class="ls-time">${block.name}<br><span style="font-weight:normal;font-size:10px">${block.display}</span></td>
        <td colspan="5" class="ls-lunch">Lunch Break · ${block.display}</td>
      </tr>`;
      return;
    }
    html += `<tr><td class="ls-time">${block.name}<br>
      <span style="font-weight:normal;font-size:10px">${block.display}</span></td>`;

    DAYS.forEach(day => {
      const matches = offs.filter(o => {
        const days  = (o.day  || '').split(',').map(d => d.trim().toLowerCase());
        const times = (o.time || '').split(',').map(t => normTime(t.trim()));
        return days.includes(day) && times.includes(block.time);
      });
      if (!matches.length) {
        html += `<td class="ls-cell"><div class="ls-empty">—</div></td>`;
      } else {
        html += `<td class="ls-cell">`;
        matches.forEach(o => {
          const enrolled = enrollCounts[o.id] || 0;
          const capacity = Number(o.capacity) || 999;
          const typeCls  = o.type === 'Commit' ? 'type-Commit' : 'type-Drop-in';
          html += `<div class="ls-card">
            <div class="ls-card-name">
              ${esc(o.name)}
              <span class="ls-card-badge ${typeCls}">${esc(o.type)}</span>
            </div>
            <div class="ls-card-detail">👤 ${esc(o.instructor)}</div>
            ${o.location ? `<div class="ls-card-detail">📍 ${esc(o.location)}</div>` : ''}
            ${o.level    ? `<div class="ls-card-detail">👥 ${esc(o.level)}</div>` : ''}
            <div class="ls-card-detail">🪑 ${enrolled}/${capacity===999?'∞':capacity} enrolled</div>
            ${o.description ? `<div class="ls-card-detail" style="margin-top:5px;padding-top:5px;
              border-top:1px solid #c5d9f0;color:#444;line-height:1.4">${esc(o.description)}</div>` : ''}
          </div>`;
        });
        html += `</td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById('learnerScheduleContainer').innerHTML = html;
}

function printLearnerSchedule() {
  if (!currentLearnerOfferings.length) return;
  const name    = currentLearnerName;
  const offs    = currentLearnerOfferings;
  const dateStr = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const timeW   = 13;
  const dayW    = ((100 - timeW) / 5).toFixed(1);

  let html = `
    <div class="ps-title">${esc(name)}'s Schedule</div>
    <div class="ps-meta">${esc(sessionConfig.fullSessionName||'')} · ${dateStr}</div>
    <table>
      <colgroup>
        <col style="width:${timeW}%">
        ${DAYS.map(()=>`<col style="width:${dayW}%">`).join('')}
      </colgroup>
      <thead><tr>
        <th>Time</th>
        ${DAYS.map(d=>`<th>${d.charAt(0).toUpperCase()+d.slice(1)}</th>`).join('')}
      </tr></thead><tbody>`;

  TIMES.forEach(block => {
    if (block.lunch) {
      html += `<tr>
        <td class="ps-time">Lunch<br><span style="font-weight:normal;font-size:7pt">${block.display}</span></td>
        <td colspan="5" class="ps-lunch">Lunch Break · ${block.display}</td>
      </tr>`;
      return;
    }
    html += `<tr><td class="ps-time">${block.name}<br>
      <span style="font-weight:normal;font-size:7pt">${block.display}</span></td>`;
    DAYS.forEach(day => {
      const matches = offs.filter(o => {
        const days  = (o.day  || '').split(',').map(d => d.trim().toLowerCase());
        const times = (o.time || '').split(',').map(t => normTime(t.trim()));
        return days.includes(day) && times.includes(block.time);
      });
      if (!matches.length) {
        html += `<td class="ps-cell ps-empty">—</td>`;
      } else {
        html += `<td class="ps-cell">`;
        matches.forEach(o => {
          const parts = [o.instructor, o.location].filter(Boolean);
          html += `<span class="ps-name">${esc(o.name)}</span>`;
          if (parts.length) html += `<span class="ps-info">${esc(parts.join(' · '))}</span>`;
        });
        html += `</td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById('printSheet').innerHTML = html;
  window.print();
}

// ── Tab switching ─────────────────────────────────────────────
function switchTab(i) {
  document.querySelectorAll('.tab').forEach((t,idx) => t.classList.toggle('active', idx===i));
  document.querySelectorAll('.tab-content').forEach((t,idx) => t.classList.toggle('active', idx===i));
}

window.onload = init;
</script>
